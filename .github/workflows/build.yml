name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null 2>&1 || true
          unzip -q madhuri-ai.zip -d s && cd s/madhuri-ai
          echo sdk.dir=$ANDROID_HOME > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: madhuri-ai-debug-apk, path: s/madhuri-ai/app/build/outputs/apk/debug/*.apk}
