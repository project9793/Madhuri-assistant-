name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Install Gradle
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-delay 3 -o /tmp/gradle.zip \
              "https://github.com/gradle/gradle-distributions/releases/download/v9.6.0/gradle-9.6.0-bin.zip" && break
            echo "attempt $i failed, retrying"; sleep 8
          done
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          /opt/gradle-9.6.0/bin/gradle --version | head -4
      - name: Build the APK
        run: |
          unzip -q madhuri-ai.zip -d s && cd s/madhuri-ai
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: {name: madhuri-ai-debug-apk, path: s/madhuri-ai/app/build/outputs/apk/debug/*.apk}
      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Madhuri AI build ${{ github.run_number }}
          files: s/madhuri-ai/app/build/outputs/apk/debug/*.apk
